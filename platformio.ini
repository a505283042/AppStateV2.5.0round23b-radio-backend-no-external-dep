[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.10.0 ; 固定平台版本，保持 Arduino-ESP32 2.0.17 API 兼容性
board = esp32-s3-devkitc-1 ; ESP32-S3 开发板：1 板
framework = arduino ; Arduino 框架

board_upload.flash_size = 16MB ; 16MB 闪存大小
board_build.partitions = partitions_16mb_coredump.csv ; 自定义分区表：保留 512KB coredump 分区

; Serial
monitor_speed = 115200 ; 115200 波特率
monitor_filters = esp32_exception_decoder ; 异常解码器：用于解码 ESP32 异常信息
; 关闭串口监视器的 DTR/RTS 控制，避免关闭/打开终端时触发复位，导致自锁电源掉电
monitor_dtr = 0
monitor_rts = 0

; 原生 USB 走 CDC 串口 + esptool 烧录，避免 esp-builtin 触发 OpenOCD/JTAG
upload_protocol = esptool 

board_build.psram = enabled ; 启用 PSRAM 以提高性能
board_build.arduino.memory_type = qio_opi ; QIO 模式，使用 OPI 接口连接 PSRAM
board_build.psram_type = opi ; OPI 接口连接 PSRAM
board_build.flash_mode = qio ; QIO 模式，使用 OPI 接口连接 PSRAM
board_build.f_flash = 80000000L ; 80MHz 闪存频率

; Build flags
build_flags =
    -D ARDUINO_USB_MODE=1 ; 启用 USB 模式
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; 启用 USB CDC 模式

    -DBOARD_HAS_PSRAM ; 启用 PSRAM
    -DAPP_LOG_LEVEL=2   ; 项目日志级别：3 = 显示调试/信息/警告/错误，2 = 日常信息，1 = 只看警告/错误，0 = 只看错误
    -DAPP_DIAG_RAM_ATTRIBUTION=0 ; 诊断：内存归因日志（0=关闭）
    -DAPP_DIAG_AUDIO_RUNTIME=0 ; 诊断：MP3/I2S 运行时异常耗时日志（0=关闭）
    -DAPP_DIAG_NAS_FLAC_PERFORMANCE=0 ; NAS FLAC 详细性能诊断（正式版本默认关闭，需要复测时改为1）
    -DAPP_DIAG_UI_RUNTIME=0 ; 诊断：UI/菜单绘制耗时日志（0=关闭）
    -I include ; 包含头文件目录
    -DUSE_UTF8_LONG_NAMES=1 ; 启用 UTF-8 长文件名
    -DSDFAT_FILE_TYPE=1 ; 文件类型：1 = FAT32，0 = FAT16

    -DUI_RENDER_PROFILING=0 ; 启用 UI 渲染性能分析（串口输出各步骤耗时统计）
    
    -DARDUINO_LOOP_STACK_SIZE=8192 ; 循环栈大小：8192 字节，NAS/Web/菜单同时运行时给 loopTask 留足余量
    -DDISABLE_FS_H_WARNING  ; 禁用 SdFat 的 FS.h 冲突警告
    -DWEBCTRL_ENABLED=1     ; 启用 Web 控制
        
; Build type
build_type = release ; 发布优化模式：降低 96kHz/24bit FLAC 软件解码负载

; Libraries
lib_deps =
    ; Display
    lovyan03/LovyanGFX@1.2.0 ; 固定显示库版本，消除 ESP32-S3 下 REG_SPI_BASE 重定义警告
    ; SD
    greiman/SdFat@2.2.3 ; SD 卡库：用于读写 SD 卡

    ; NFC
    Arduino_MFRC522v2=https://github.com/OSSLibraries/Arduino_MFRC522v2/archive/refs/tags/2.0.6.zip ; 固定 NFC 库版本，避免 # 被编辑器识别为注释
